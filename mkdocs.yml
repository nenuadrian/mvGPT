site_name: mvGPT
site_description: >-
  Minimum Viable GPT: a small decoder-only transformer, written from scratch in PyTorch and readable
  end to end.
site_author: Adrian Nenu
site_url: https://nenuadrian.github.io/mvGPT/

repo_url: https://github.com/nenuadrian/mvGPT
repo_name: nenuadrian/mvGPT
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 mvGPT maintainers

theme:
  name: material
  language: en
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://mvgpt.nenuadrian.com
    - icon: fontawesome/brands/github
      link: https://github.com/nenuadrian/mvGPT

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Pretraining: pretraining.md
  - Supervised fine-tuning: sft.md
  - Watching training: tracking.md
  - The KV cache: kv-cache.md
  - Sharing and serving: deploy.md
  - Profiling: profiling.md
  - Preferences, with DPO: dpo.md
  - Reinforcement learning, with PPO: ppo.md
  - LoRA: lora.md
  - Rotary position embeddings: rope.md
